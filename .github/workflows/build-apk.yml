name: Build Android APK (SakuIN)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --include=dev

      - name: Sync Capacitor Android
        run: |
          npx @capacitor/cli sync android || true

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses & Install Platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build APK (Debug / Standalone)
        run: |
          cd android
          if ! ./gradlew :app:assembleDebug --stacktrace --no-daemon > ../build.log 2>&1; then
            ERROR_MSG=$(grep -A 10 "FAILURE: Build failed with an exception" ../build.log | tr '\n' ' ' | cut -c 1-450)
            echo "::error::Gradle: $ERROR_MSG"
            CAUSED_BY=$(grep -A 5 "Caused by:" ../build.log | head -n 15 | tr '\n' ' ' | cut -c 1-450)
            echo "::error::CausedBy: $CAUSED_BY"
            exit 1
          fi
          cat ../build.log | tail -n 30

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/

      - name: Prepare APK for Release
        run: |
          echo "=== Searching for generated APK files ==="
          find android -type f -name "*.apk" || true
          
          APK_FILE=$(find android -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found after assembleDebug!"
            find android/app/build -maxdepth 4 || true
            exit 1
          fi
          
          echo "Selected APK: $APK_FILE"
          cp "$APK_FILE" sakuin-v1.0.0.apk
          cp "$APK_FILE" sakuin.apk
          cp "$APK_FILE" "sakuin v1.0.0.apk"
          ls -lh sakuin-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuIN-Android-APK
          path: sakuin-v1.0.0.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: SakuIN v1.0.0 (Android APK)
          files: |
            sakuin-v1.0.0.apk
            sakuin.apk
            sakuin v1.0.0.apk
          body: |
            ## Rilis Resmi SakuIN APK Android (v1.0.0)
            - Aplikasi Native Android mandiri (didukung Android AlarmManager).
            - Notifikasi pengingat harian berbunyi tepat waktu meski aplikasi ditutup atau layar HP mati.
            - Sangat ringan (~4.5 MB), hemat kuota mahasiswa.
            - Login dengan Akun Google didukung penuh.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
