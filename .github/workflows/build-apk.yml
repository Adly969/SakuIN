name: Build Android APK (SakuIN)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --include=dev

      - name: Sync Capacitor Android
        run: |
          npx @capacitor/cli sync android || true

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build APK (Debug / Standalone)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk sakuin-v1.0.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk sakuin.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SakuIN-Android-APK
          path: sakuin-v1.0.0.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: SakuIN v1.0.0 (Android APK)
          files: |
            sakuin-v1.0.0.apk
            sakuin.apk
          body: |
            ## Rilis Resmi SakuIN APK Android (v1.0.0)
            - Aplikasi Native Android mandiri (didukung Android AlarmManager).
            - Notifikasi pengingat harian berbunyi tepat waktu meski aplikasi ditutup atau layar HP mati.
            - Sangat ringan (~4.5 MB), hemat kuota mahasiswa.
            - Login dengan Akun Google didukung penuh.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
